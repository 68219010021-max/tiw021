<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY PROFILE</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #080b18;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .container {
        width: 85%;
        max-width: 650px;
        padding: 45px;
        text-align: center;
        background: #111827;
        border: 2px solid #00e5ff;
        border-radius: 20px;
        box-shadow: 0 0 20px #00e5ff,
                    0 0 50px rgba(0,229,255,0.2);
        position: relative;
    }

    .top {
        color: #00e5ff;
        font-size: 14px;
        letter-spacing: 6px;
    }

    h1 {
        color: white;
        font-size: 40px;
        letter-spacing: 4px;
        text-shadow: 0 0 15px #00e5ff;
    }

    .line {
        width: 100px;
        height: 4px;
        background: #00e5ff;
        margin: 20px auto;
        box-shadow: 0 0 15px #00e5ff;
    }

    .welcome {
        color: #a5b4fc;
        font-size: 22px;
    }

    .name {
        background: #080b18;
        padding: 20px;
        border: 1px solid #7c3aed;
        border-radius: 15px;
        margin-top: 25px;
        box-shadow: 0 0 15px rgba(124,58,237,0.3);
    }

    .name p {
        color: white;
        font-size: 20px;
        margin: 15px;
    }

    .name span {
        color: #00e5ff;
        font-weight: bold;
    }

    .decoration {
        color: #7c3aed;
        font-size: 30px;
        margin: 25px;
        letter-spacing: 12px;
    }

    footer {
        color: #64748b;
        margin-top: 30px;
        font-size: 13px;
        letter-spacing: 3px;
    }

    .container:hover {
        box-shadow: 0 0 30px #00e5ff,
                    0 0 70px rgba(124,58,237,0.4);
        transform: translateY(-5px);
        transition: 0.4s;
    }
</style>
</head>

<body>

<div class="container">

    <div class="top">WELCOME TO MY WEBSITE</div>

    <h1>MY PROFILE</h1>

    <div class="line"></div>

    <div class="decoration">◆ ✦ ◆</div>

    <p class="welcome">สวัสดี ยินดีต้อนรับเข้าสู่เว็บไซต์ของฉัน</p>

    <div class="name">
        <p>NAME : <span>จิรพัฒน์ ศรีเมือง</span></p>
        <p>NICKNAME : <span>ทิว</span></p>
    </div>

    <div class="decoration">✦ ◆ ✦</div>

    <footer>
        © 2026 MY PERSONAL WEBSITE
    </footer>

</div>

</body>
</html>
