<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK DEMON</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle, #350000, #100000 50%, #000);
    color: white;
}

.container {
    width: 85%;
    max-width: 700px;
    padding: 45px;
    text-align: center;
    background: linear-gradient(145deg, #1b0808, #080808);
    border: 2px solid #a00000;
    border-radius: 15px;
    box-shadow: 0 0 25px #ff000055;
    transition: 0.4s;
}

.container:hover {
    transform: translateY(-8px);
    box-shadow: 0 0 40px #ff0000aa;
}

.demon {
    font-size: 65px;
    text-shadow: 0 0 20px red;
}

.top {
    color: #ff3030;
    letter-spacing: 8px;
    font-size: 13px;
}

h1 {
    font-size: 45px;
    letter-spacing: 5px;
    color: #ff2020;
    text-shadow: 0 0 15px red;
}

.line {
    width: 100px;
    height: 3px;
    background: red;
    margin: 20px auto;
    box-shadow: 0 0 15px red;
}

.subtitle {
    color: #aaa;
    letter-spacing: 3px;
}

.name {
    margin-top: 30px;
    padding: 25px;
    background: #100606;
    border: 1px solid #850000;
    border-radius: 10px;
}

.name p {
    font-size: 20px;
    color: white;
}

.name span {
    color: #ff3333;
    font-weight: bold;
}

.decoration {
    font-size: 25px;
    color: red;
    letter-spacing: 15px;
    margin: 25px;
}

footer {
    margin-top: 30px;
    color: #777;
    font-size: 12px;
    letter-spacing: 4px;
}
</style>
</head>

<body>

<div class="container">

    <div class="demon">👿</div>

    <div class="top">WELCOME TO THE DARK SIDE</div>

    <h1>DARK DEMON</h1>

    <div class="line"></div>

    <div class="decoration">☠️ 🔥 ☠️</div>

    <p class="subtitle">THIS IS MY WORLD</p>

    <div class="name">
        <p>ชื่อจริง : <span>จิรพัฒน์ ศรีเมือง</span></p>
        <p>ชื่อเล่น : <span>ทิว</span></p>
    </div>

    <div class="decoration">😈 ⚡ 😈</div>

    <footer>
        © 2026 DARK DEMON | NO LIMITS
    </footer>

</div>

</body>
</html>
