<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My History</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .container {
        background: white;
        width: 80%;
        max-width: 600px;
        padding: 40px;
        border-radius: 30px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        border: 5px solid #74b9ff;
        position: relative;
    }

    h1 {
        color: #0984e3;
        background: #dff1ff;
        padding: 20px;
        border-radius: 20px;
        border-bottom: 5px solid #74b9ff;
    }

    p {
        color: #6c5ce7;
        font-size: 20px;
        line-height: 1.8;
    }

    .name {
        background: #e8f8f5;
        padding: 20px;
        border-radius: 20px;
        border: 3px dashed #55efc4;
        margin-top: 20px;
    }

    .name p {
        color: #00a884;
        font-weight: bold;
    }

    .decoration {
        font-size: 35px;
        margin: 10px;
    }

    .stars {
        font-size: 25px;
        letter-spacing: 10px;
        margin: 20px;
    }

    footer {
        margin-top: 25px;
        background: #fff0f5;
        padding: 15px;
        border-radius: 15px;
        color: #e17055;
        font-size: 16px;
    }

</style>
</head>

<body>

<div class="container">

    <div class="decoration">🌈 🌸 ⭐ 🌸 🌈</div>

    <h1>🌟 ประวัติส่วนตัว 🌟</h1>

    <div class="stars">✨ 💙 ✨ 💙 ✨</div>

    <p>สวัสดีจ้า 👋</p>

    <div class="name">
        <p>👤 ชื่อจริง : จิรพัฒน์ ศรีเมือง</p>
        <p>💖 ชื่อเล่น : ทิว</p>
    </div>

    <div class="decoration">🌷 🦋 🌷</div>

    <footer>
        💙 ยินดีต้อนรับเข้าสู่เว็บไซต์ของฉัน 💙
    </footer>

</div>

</body>
</html>
